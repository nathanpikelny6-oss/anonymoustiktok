<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>PeekTok</title>
    <script>
      // GitHub Pages SPA fallback (project site: /anonymoustiktok/)
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + pathSegmentsToKeep)
            .join("/") +
          "/?p=" +
          decodeURIComponent(
            l.pathname
              .split("/")
              .slice(1 + pathSegmentsToKeep)
              .join("/")
              .replace(/&/g, "~and~") +
              l.search +
              l.hash,
          ),
      );
    </script>
  </head>
  <body></body>
</html>
