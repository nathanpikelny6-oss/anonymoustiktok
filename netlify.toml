[build]
  command = "bash scripts/prepare-ytdlp.sh && npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["netlify/functions-bin/yt-dlp"]

[functions.api]
  node_bundler = "esbuild"
  timeout = 60

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200